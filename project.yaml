# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# project.yaml — single source of truth for all project-specific configuration.
#
# When starting a new project from this template, run
#   make init NAME=<project_name> REPO=https://github.com/<org>/<repo>
# which rewrites the identity values below, renames the protos and Go module,
# and regenerates everything. See README "Starting a new project".
#
# After any later edit here, run `make generate-k8s` to re-render k8s/*.yaml
# and web/.env.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Project Identity ──────────────────────────────────────────────────────────

# project_name: base identifier used for k8s resource names (Deployment, Service,
#   PostgreSQL cluster, proto ConfigMap) and the PostgreSQL database/owner name.
#   Convention: short, lowercase, no hyphens — matches the proto service name and
#   the Go package name used in main.go.
project_name: greeter

# namespace: the k8s namespace where all application resources are deployed.
#   Change this when running multiple instances on the same cluster.
namespace: grpc-demo

# image_name: container image name for the Go gRPC backend.
#   Tagged and pushed as: <node_ip_tailscale>:<registry_port>/<image_name>:<version>-<git-sha>
#   Referenced in k8s manifests as: <node_ip_lan>:<registry_port>/<image_name>:<version>-<git-sha>
image_name: sample-grpc

# web_image_name: container image name for the React web front-end.
#   Same tagging convention as image_name above.
web_image_name: sample-grpc-web

# ── Public Access ─────────────────────────────────────────────────────────────

# public_domain: the public hostname served via the cluster's shared Cloudflare
#   tunnel. k8s/tunnelroute.yaml asks Cloudflare-Tunnel-Operator to route it to the
#   ClusterIP service http://<project_name>-service.<namespace>:80 and to create
#   the proxied DNS record. No dashboard setup or tunnel token is needed.
public_domain: grpc-demo.latentlab.cc

# tunnel_name: the ClusterTunnel (cluster-scoped) this project's hostname attaches
#   to. Every project on the cluster shares one tunnel; "home" is the default.
tunnel_name: home

# tunnel_adopt_dns: set to true when public_domain already has a DNS record the
#   operator didn't create (for example one left by an old dashboard-managed
#   tunnel), so the operator may take it over. Set it back to false once the
#   TunnelRoute is Ready: the record is then marked as operator-managed.
tunnel_adopt_dns: false

# github_repo: URL of the source repository, shown as a GitHub icon link in the web UI.
#   Update this when forking or renaming the repository.
github_repo: https://github.com/CallMeCCLemon/SampleGrpcService

# google_client_id: OAuth 2.0 client ID for Google Sign-In.
#   Baked into the web bundle at build time (client IDs are public, not secrets)
#   and validated server-side against the aud claim on Google ID tokens.
#   Create yours at https://console.cloud.google.com/apis/credentials.
#   Leave empty to disable Google sign-in (server still starts; LoginWithGoogle
#   will reject all tokens).
google_client_id: ""

# ── Cluster Networking ────────────────────────────────────────────────────────

# node_ip_lan: LAN IP of the primary k8s node (typically the control-plane).
#   Used in k8s manifests as the image pull address and for direct LAN access.
node_ip_lan: 192.168.1.110

# node_ip_tailscale: Tailscale (or other VPN) IP of the same node.
#   Used by the dev machine to push images (avoids routing constraints on LAN).
#   Both node_ip_lan and node_ip_tailscale point to the same registry pod —
#   the registry stores images by repo path, not by the hostname used to push.
node_ip_tailscale: 100.69.236.43

# registry_port: NodePort exposed by the local container registry pod.
registry_port: 32000

# ── API Routing ───────────────────────────────────────────────────────────────

# api_prefix: URL path prefix for all Kong Ingress routes.
#   Kong routes any request starting with this prefix to the gRPC service and
#   does NOT strip the prefix before forwarding (strip-path: "false" in
#   kong.yaml). That means proto google.api.http annotations must include the
#   full prefix — e.g. post: "/greeter/api/echo", not post: "/echo".
#   The `make check-api-paths` target enforces this.
#
#   Including the project name in the prefix (`/greeter/api`) lets multiple
#   projects share one Kong gateway without path collisions.
#   Must start with / and not end with /.
api_prefix: /greeter/api

# ── NodePorts ─────────────────────────────────────────────────────────────────
# All NodePorts must be in the k8s range 30000–32767 and unique within the cluster.

# grpc_nodeport: NodePort for the gRPC backend service.
#   Used by: Kong Ingress Controller (upstream), grpcurl, `make loadtest`.
grpc_nodeport: 30051

# kong_nodeport: NodePort for the Kong API Gateway (HTTP/JSON → gRPC transcoding).
#   Used by: the Vite dev proxy, curl tests, and any HTTP client hitting the API.
#   Shared by every project on the cluster's single Kong gateway; owned by the
#   platform repo's kong-values.yaml, not by this project.
kong_nodeport: 30080

# web_nodeport: NodePort for the React web front-end (Nginx).
#   For direct LAN access. Production traffic is routed via the Cloudflare tunnel.
web_nodeport: 30090

# ── Coverage Floors ───────────────────────────────────────────────────────────
# Minimum Go test coverage percentages enforced by `make coverage-check`.
# This is a sample/template repo with no real test suite, so defaults are 0.0.
# Bump these as the test suite grows; both accept floats (e.g. 54.5).

# coverage_global_min: floor for total coverage across all non-exempt packages.
coverage_global_min: 0.0

# coverage_package_min: floor for each individual non-exempt package.
coverage_package_min: 0.0

# coverage_exempt_patterns: pipe-separated egrep regex of package paths to
#   exclude from the per-package floor. Leave blank to enforce on everything.
#   Examples (uncomment to use):
#     coverage_exempt_patterns: /cmd/|/pb$
coverage_exempt_patterns:
