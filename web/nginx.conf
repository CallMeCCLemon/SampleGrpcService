server {
    listen 80;

    # Lets Google Sign-In's popup postMessage the credential back without a
    # Chrome console warning. Sign-in works either way.
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # Forward /greeter/* to Kong, preserving the full path. Kong runs with
    # strip-path: "false" and matches /greeter/api/... against the proto
    # HTTP annotations. The /greeter prefix keeps API routes namespaced so
    # client-side React Router paths (/about, /profile, etc.) never collide
    # with the Kong proxy.
    location /greeter/ {
        proxy_pass http://kong-gateway-proxy.kong;
        proxy_set_header Content-Type application/json;
        # The Kong Ingress is host-scoped to the public domain. Without the
        # original Host, Kong sees kong-gateway-proxy.kong and matches no route.
        proxy_set_header Host $http_host;
    }

    # Serve the React SPA — try the exact file, then directory, then fall back
    # to index.html so React Router can handle the route client-side.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
