#
# Publishes grpc-demo.latentlab.cc through the cluster's shared Cloudflare tunnel
# (ClusterTunnel "home", managed by Cloudflare-Tunnel-Operator). The
# operator adds the hostname to the tunnel's config and creates the proxied DNS
# record, so there is no per-project cloudflared, tunnel token, or dashboard step.
#
# Check it with: kubectl -n grpc-demo get tunnelroute greeter
apiVersion: tunnels.latentlab.cc/v1alpha1
kind: TunnelRoute
metadata:
  name: greeter
  namespace: grpc-demo
spec:
  tunnelRef:
    name: home
  hostname: grpc-demo.latentlab.cc
  service:
    name: greeter-service
    port: 80
  # true lets the operator take over a DNS record it didn't create, e.g. one left
  # by a dashboard-managed tunnel. Only needed for the first apply after migrating.
  adoptExistingDnsRecord: false
